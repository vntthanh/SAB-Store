services:
  # SAB Lanyard MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: sabstore_mongodb
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Bound to loopback only: dev still needs host access (GUI clients,
      # scripts) but never to the LAN/internet interface.
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SAB Lanyard MinIO Object Storage
  minio:
    # Pinned (P2-27) - see prod.compose.yml for rationale.
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: sabstore_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - minio_data:/data
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SAB Lanyard Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: always
    container_name: sabstore_backend
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-5000}
      # Single source for the public origin (AD-2): BASE_URL/CORS_ORIGIN
      # both derive from PUBLIC_URL instead of carrying their own values
      # that can drift apart. `:-` keeps this a soft default in dev only;
      # prod.compose.yml uses `:?` to fail fast instead.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      BASE_URL: ${PUBLIC_URL:-http://localhost}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/minipreorder?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-sab@fit.hcmus.edu.vn}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APPSCRIPT_URL: ${APPSCRIPT_URL:-your-appscript-url-here}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      # MinIO service account TODO: see prod.compose.yml - intentionally NOT
      # merged with MINIO_ROOT_USER/PASSWORD above (AD-2).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # SAB Lanyard Frontend React App (with Nginx Reverse Proxy)
  frontend:
    # No VITE_API_URL build arg/env: the SPA calls the API via the relative
    # path /api (AD-3), so nothing domain-specific is baked into the bundle.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: always
    container_name: sabstore_frontend
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Bound to loopback only: dev still needs host access via a browser
      # on the same machine, but never to the LAN/internet interface.
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  minio_data:
  backend_node_modules:


networks:
  sabstore_network:
    driver: bridge
