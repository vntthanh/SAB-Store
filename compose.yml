services:
  # SAB Store MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: sabstore_mongodb
    restart: unless-stopped
    # Replica set (not standalone) so multi-document transactions work. The keyfile
    # is generated from the runtime env at every start, so nothing has to exist on
    # the host beforehand. It lives in /etc/mongo, not /tmp: the host sets
    # fs.protected_regular=2, which forbids even root from re-creating a file owned
    # by another user in a sticky directory, and a restarted (not recreated)
    # container still holds last run's mongodb-owned file - hence the `rm -f`.
    # Every `$` is doubled: compose would otherwise interpolate it first.
    #
    # Fail-closed on purpose: the platform turns an unset variable into an empty
    # string, and a mongod with no usable keyfile must never start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        key="$${MONGO_REPLICA_KEY:-}"
        case "$$key" in
          '' | *[!A-Za-z0-9+/=]*) fail "MONGO_REPLICA_KEY must be non-empty base64 characters only (no newlines)" ;;
        esac
        [ "$${#key}" -ge 6 ] && [ "$${#key}" -le 1024 ] || fail "MONGO_REPLICA_KEY must be 6-1024 characters"
        umask 077
        mkdir -p /etc/mongo
        # umask 077 would leave the directory 0700 root: mongod (uid 999) could not reach its keyfile.
        chmod 755 /etc/mongo
        rm -f /etc/mongo/keyfile
        printf '%s' "$$key" > /etc/mongo/keyfile
        # mongod runs as uid 999 after the image entrypoint drops privileges; it
        # rejects a keyfile that is group/world accessible or not readable by it.
        chown 999:999 /etc/mongo/keyfile
        chmod 400 /etc/mongo/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo/keyfile --bind_ip_all --wiredTigerCacheSizeGB 0.25
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      # Dev-only key (base64 of a fixed phrase); never reuse it outside a local stack.
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:-ZGV2LW9ubHktcmVwbGljYS1rZXktc2FiLXN0b3Jl}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Bound to loopback only: dev still needs host access (GUI clients,
      # scripts) but never to the LAN/internet interface.
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sabstore_network
    # Idempotent bootstrap: the first probe that finds the set uninitialised
    # (fresh or just-converted data dir) initiates it; afterwards it only reports
    # whether this node is primary. Credentials come from the container env via
    # process.env, so they never appear in argv or output.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --quiet --eval '
            const admin = db.getSiblingDB("admin");
            if (!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
            try {
              admin.runCommand({ replSetGetStatus: 1 });
            } catch (e) {
              if (e.code !== 94 && e.codeName !== "NotYetInitialized") quit(1);
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            }
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # SAB Store object storage (SeaweedFS, S3 API on :9000)
  sabstore-seaweedfs:
    container_name: sabstore_seaweedfs
    # Replaces MinIO, whose upstream repository is archived. Pinned by digest;
    # 4.47 contains the fixes for the published path-traversal CVEs.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    # Written inline so the identity and signing key are generated from the
    # platform environment at every start. Every `$` is doubled: compose would
    # otherwise interpolate it before the shell sees it.
    #
    # Fail-closed on purpose: a missing identity file makes SeaweedFS accept
    # anonymous S3 writes, and the platform turns an unset variable into an empty
    # string instead of failing, so `set -u` alone would not catch it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        check_key() {
          [ -n "$$2" ] || fail "$$1 is empty"
          [ "$$2" != minioadmin ] || fail "$$1 must not be the default minioadmin"
          [ "$${#2}" -ge 16 ] || fail "$$1 must be at least 16 characters"
          case "$$2" in *'"'* | *'\'*) fail "$$1 must not contain a quote or backslash" ;; esac
        }
        check_key MINIO_ROOT_USER "$${S3_ACCESS_KEY:-}"
        check_key MINIO_ROOT_PASSWORD "$${S3_SECRET_KEY:-}"
        case "$${S3_BUCKET:-}" in
          '' | *[!a-z0-9-]*) fail "MINIO_BUCKET_NAME must be non-empty and use only a-z, 0-9 and -" ;;
        esac
        umask 077
        # Config lives in /etc/seaweedfs, not /tmp: the host sets
        # fs.protected_regular=2, which forbids even root from re-creating a file
        # owned by another user in a sticky directory. A container that was
        # restarted rather than recreated still holds last run's seaweed-owned
        # files, so they are removed before being written again.
        mkdir -p /etc/seaweedfs
        rm -f /etc/seaweedfs/s3.json /etc/seaweedfs/security.toml
        printf '{"identities":[{"name":"sabstore-backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin:%s","Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /etc/seaweedfs/s3.json
        # Without a filer signing key the internal gRPC IAM cache accepts
        # unauthenticated callers, who could mint themselves an admin identity.
        printf '[jwt.filer_signing]\nkey = "%s"\n' "$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /etc/seaweedfs/security.toml
        # The image entrypoint drops to the `seaweed` user. Root-owned 0600 files
        # are then unreadable and SeaweedFS silently starts with no identities and
        # no signing key, i.e. wide open.
        chown seaweed:seaweed /etc/seaweedfs/s3.json /etc/seaweedfs/security.toml
        exec /entrypoint.sh server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/etc/seaweedfs/s3.json
    mem_limit: 768m
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sabstore-dev-access}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sabstore-dev-secret-key}
      S3_BUCKET: ${MINIO_BUCKET_NAME:-sabstore}
      # Go's heap is otherwise uncapped (~600 MiB observed) and would hit mem_limit.
      GOMEMLIMIT: 384MiB
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host. Master/volume/filer listen on loopback inside
    # the container; only the S3 port is reachable, from sabstore_network (backend
    # SDK and the frontend nginx /uploads/ proxy).
    expose:
      - "9000"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sabstore_network

  # SAB Store Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: always
    container_name: sabstore_backend
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Fixed rather than read from .env: the shared .env.example is production-
      # shaped, and production mode refuses to initialise an empty database.
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-5000}
      # Single source for the public origin (AD-2): BASE_URL/CORS_ORIGIN
      # both derive from PUBLIC_URL instead of carrying their own values
      # that can drift apart. `:-` keeps this a soft default in dev only;
      # prod.compose.yml uses `:?` to fail fast instead.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      BASE_URL: ${PUBLIC_URL:-http://localhost}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/minipreorder?authSource=admin&replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-sab@fit.hcmus.edu.vn}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APPSCRIPT_URL: ${APPSCRIPT_URL:-your-appscript-url-here}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      # The MINIO_* names are kept for the minio SDK; the server behind them is
      # SeaweedFS. The dev defaults are long enough to pass its key checks.
      MINIO_ENDPOINT: sabstore-seaweedfs
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sabstore-dev-access}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sabstore-dev-secret-key}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
      sabstore-seaweedfs:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # SAB Store Frontend React App (with Nginx Reverse Proxy)
  frontend:
    # No VITE_API_URL build arg/env: the SPA calls the API via the relative
    # path /api (AD-3), so nothing domain-specific is baked into the bundle.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: always
    container_name: sabstore_frontend
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Bound to loopback only: dev still needs host access via a browser
      # on the same machine, but never to the LAN/internet interface.
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  seaweedfs_data:
  backend_node_modules:


networks:
  sabstore_network:
    driver: bridge
