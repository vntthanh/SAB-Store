services:
  # SAB Store MongoDB Database
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    # Default WiredTiger cache is 50% x (RAM - 1GB) ~= 4.3GB on this box,
    # which is shared with ~40 containers from other projects.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SAB Store object storage (SeaweedFS, S3 API on :9000)
  sabstore-seaweedfs:
    # Replaces MinIO, whose upstream repository is archived. Pinned by digest;
    # 4.47 contains the fixes for the published path-traversal CVEs.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    # Written inline so the identity and signing key are generated from the
    # platform environment at every start. Every `$` is doubled: compose would
    # otherwise interpolate it before the shell sees it.
    #
    # Fail-closed on purpose: a missing identity file makes SeaweedFS accept
    # anonymous S3 writes, and the platform turns an unset variable into an empty
    # string instead of failing, so `set -u` alone would not catch it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        check_key() {
          [ -n "$$2" ] || fail "$$1 is empty"
          [ "$$2" != minioadmin ] || fail "$$1 must not be the default minioadmin"
          [ "$${#2}" -ge 16 ] || fail "$$1 must be at least 16 characters"
          case "$$2" in *'"'* | *'\'*) fail "$$1 must not contain a quote or backslash" ;; esac
        }
        check_key MINIO_ROOT_USER "$${S3_ACCESS_KEY:-}"
        check_key MINIO_ROOT_PASSWORD "$${S3_SECRET_KEY:-}"
        case "$${S3_BUCKET:-}" in
          '' | *[!a-z0-9-]*) fail "MINIO_BUCKET_NAME must be non-empty and use only a-z, 0-9 and -" ;;
        esac
        umask 077
        printf '{"identities":[{"name":"sabstore-backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin:%s","Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/s3.json
        # Without a filer signing key the internal gRPC IAM cache accepts
        # unauthenticated callers, who could mint themselves an admin identity.
        mkdir -p /etc/seaweedfs
        printf '[jwt.filer_signing]\nkey = "%s"\n' "$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /etc/seaweedfs/security.toml
        # The image entrypoint drops to the `seaweed` user. Root-owned 0600 files
        # are then unreadable and SeaweedFS silently starts with no identities and
        # no signing key, i.e. wide open.
        chown seaweed:seaweed /tmp/s3.json /etc/seaweedfs/security.toml
        exec /entrypoint.sh server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/tmp/s3.json
    mem_limit: 768m
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${MINIO_BUCKET_NAME:-sabstore}
      # Go's heap is otherwise uncapped (~600 MiB observed) and would hit mem_limit.
      GOMEMLIMIT: 384MiB
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host. Master/volume/filer listen on loopback inside
    # the container; only the S3 port is reachable, from sabstore_network (backend
    # SDK and the frontend nginx /uploads/ proxy).
    expose:
      - "9000"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sabstore_network

  # SAB Store Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Only for the very first deploy on an empty database; the backend refuses
      # to initialise an empty production DB otherwise (catches a wrong DB name).
      INIT_EMPTY_DATABASE: ${INIT_EMPTY_DATABASE:-}
      PORT: ${BACKEND_PORT:-5000}
      # PUBLIC_URL is the single source for the public origin (AD-2):
      # BASE_URL and CORS_ORIGIN both derive from it instead of carrying
      # their own copies that can drift apart.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      BASE_URL: ${PUBLIC_URL}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      APPSCRIPT_URL: ${APPSCRIPT_URL:?APPSCRIPT_URL is required}
      CORS_ORIGIN: ${PUBLIC_URL}
      # The MINIO_* names are kept for the minio SDK; the server behind them is
      # SeaweedFS. The endpoint is fixed because the platform environment store
      # may still carry the old MinIO hostname, which would silently win.
      MINIO_ENDPOINT: sabstore-seaweedfs
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
        restart: true
      sabstore-seaweedfs:
        condition: service_healthy
        restart: true
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Only the frontend joins multi-domain. The backend is reachable
    # exclusively through the frontend nginx /api/ proxy.
    #
    # The alias must be project-unique: `multi-domain` is shared with other
    # stacks and another project already owns the plain name `backend` there,
    # so the frontend (which is on both networks) would resolve to it.
    networks:
      sabstore_network:
        aliases:
          - sabstore-backend

  # SAB Store Frontend React App (with Nginx Reverse Proxy)
  frontend:
    # No VITE_API_URL build arg/env: the SPA calls the API via the relative
    # path /api (AD-3), so nothing domain-specific is baked into the bundle.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - 80
    depends_on:
      backend:
        condition: service_started
        restart: true
    networks:
      sabstore_network:
      multi-domain:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  seaweedfs_data:
  backend_uploads:


networks:
  sabstore_network:
    driver: bridge
  multi-domain:
    external: true
    name: multi-domain
