services:
  # SAB Lanyard MongoDB Database
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    # Default WiredTiger cache is 50% x (RAM - 1GB) ~= 4.3GB on this box,
    # which is shared with ~40 containers from other projects.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SAB Lanyard MinIO Object Storage
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host: MinIO is reached only from inside
    # sabstore_network (backend SDK, and the frontend nginx /uploads/ proxy).
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SAB Lanyard Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      BASE_URL: ${BACKEND_URL:-http://localhost}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      APPSCRIPT_URL: ${APPSCRIPT_URL:?APPSCRIPT_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    # Only the frontend joins multi-domain. The backend is reachable
    # exclusively through the frontend nginx /api/ proxy.
    networks:
      - sabstore_network

  # SAB Lanyard Frontend React App (with Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${REACT_APP_API_URL:-http://localhost}
    pull_policy: always
    environment:
      VITE_API_URL: ${REACT_APP_API_URL:-http://localhost}
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      backend:
        condition: service_started
    networks:
      sabstore_network:
      multi-domain:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  minio_data:
  backend_uploads:


networks:
  sabstore_network:
    driver: bridge
  multi-domain:
    external: true
    name: multi-domain
