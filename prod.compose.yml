services:
  # SAB Lanyard MongoDB Database
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    # Default WiredTiger cache is 50% x (RAM - 1GB) ~= 4.3GB on this box,
    # which is shared with ~40 containers from other projects.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SAB Lanyard MinIO Object Storage
  minio:
    # Pinned by DIGEST, not tag, and deliberately so.
    #
    # The minio/minio repository has been REMOVED from Docker Hub — the
    # registry returns 404 for the repository itself, not merely for a tag, so
    # no MinIO image can be pulled from there any more. A tag pin therefore
    # sends `up -d` looking for something that cannot be fetched, and MinIO
    # fails to start. This digest is the image already present on the
    # production host (`minio/minio:latest` as resolved on 2025-09-07), so the
    # daemon uses the local copy and never reaches out.
    #
    # Consequences to keep in mind:
    #   - This image predates RELEASE.2025-10-15T17-29-55Z and so is missing
    #     that release's privilege-escalation fix. It cannot be obtained; the
    #     mitigation is that MinIO is not exposed to the internet (expose:
    #     only, reachable solely through the frontend nginx `/uploads/` path).
    #   - The image is now IRREPLACEABLE. `docker image prune -a` on this host
    #     would destroy it permanently. Keep a `docker save` archive.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host: MinIO is reached only from inside
    # sabstore_network (backend SDK, and the frontend nginx /uploads/ proxy).
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - sabstore_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SAB Lanyard Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      # PUBLIC_URL is the single source for the public origin (AD-2):
      # BASE_URL and CORS_ORIGIN both derive from it instead of carrying
      # their own copies that can drift apart.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      BASE_URL: ${PUBLIC_URL}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      APPSCRIPT_URL: ${APPSCRIPT_URL:?APPSCRIPT_URL is required}
      CORS_ORIGIN: ${PUBLIC_URL}
      # MinIO service account TODO: backend currently authenticates with the
      # MinIO root credential. Intentionally NOT merged with
      # MINIO_ROOT_USER/PASSWORD above (AD-2) - split into a bucket-scoped
      # `sabstore` service account via `mc admin user add` + policy; out of
      # scope for this phase, tracked separately.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Only the frontend joins multi-domain. The backend is reachable
    # exclusively through the frontend nginx /api/ proxy.
    #
    # The alias must be project-unique: `multi-domain` is shared with other
    # stacks and another project already owns the plain name `backend` there,
    # so the frontend (which is on both networks) would resolve to it.
    networks:
      sabstore_network:
        aliases:
          - sabstore-backend

  # SAB Lanyard Frontend React App (with Nginx Reverse Proxy)
  frontend:
    # No VITE_API_URL build arg/env: the SPA calls the API via the relative
    # path /api (AD-3), so nothing domain-specific is baked into the bundle.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - 80
    depends_on:
      backend:
        condition: service_started
        restart: true
    networks:
      sabstore_network:
      multi-domain:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  minio_data:
  backend_uploads:


networks:
  sabstore_network:
    driver: bridge
  multi-domain:
    external: true
    name: multi-domain
