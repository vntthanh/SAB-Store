server {
	listen 80;
	server_name localhost;
	root /usr/share/nginx/html;

	# Ensure correct MIME types are loaded
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Performance optimization
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	# No global override: default (1M) applies to every route except
	# /api/upload, which sets its own limit below. Shrinks upload surface.

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css text/xml text/javascript
	           application/json application/javascript application/xml+rss
	           application/rss+xml font/truetype font/opentype
	           application/vnd.ms-fontobject image/svg+xml;
	gzip_disable "msie6";

	# Security headers
	include /etc/nginx/security-headers.conf;

	# DNS resolver - use Docker internal DNS for service discovery
	resolver 127.0.0.11 valid=10s ipv6=off;
	resolver_timeout 5s;

	# Health check endpoint
	location /health {
		access_log off;
		return 200 "healthy\n";
		add_header Content-Type text/plain;
	}

	# API requests - proxy to backend
	location /api/ {
		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		# Proxy headers
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;

		# Buffering
		proxy_buffering on;
		proxy_buffer_size 4k;
		proxy_buffers 8 4k;
		proxy_busy_buffers_size 8k;

		# Disable cache for API
		proxy_no_cache 1;
		proxy_cache_bypass 1;
	}

	# Upload endpoint - special handling for large files
	location /api/upload {
		client_max_body_size 50M;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Extended timeouts for uploads
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		# Request buffering off for large uploads
		proxy_request_buffering off;
	}

	# Database import accepts a JSON dump of the whole store. Without an explicit
	# limit it falls under `location /api/` and inherits nginx's 1M default, so a
	# full export is rejected with 413 before it ever reaches the backend — which
	# accepts up to 10M via multer (routes/admin/database.js). The longer prefix
	# makes this win over /api/. Keep this at or above multer's limit so an
	# oversized file gets the backend's explicit 400 instead of a bare nginx 413.
	location /api/admin/database/import {
		client_max_body_size 10M;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Importing hundreds of orders takes far longer than a normal API call.
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		proxy_request_buffering off;
	}

	# The bare prefix would map to the bucket root and let anyone list it.
	location = /uploads/ {
		return 404;
	}

	# Static product images directly from object storage (SeaweedFS S3), must be
	# BEFORE the regex static files location. The bucket is anonymous-read, so this
	# proxy must expose object GETs only, never S3 sub-resources or writes.
	location ^~ /uploads/ {
		# GET implies HEAD. Everything else (PUT/DELETE/POST) is refused here
		# regardless of what the bucket policy would allow.
		limit_except GET {
			deny all;
		}

		# Encoded or literal dot-segments and backslashes could climb out of the
		# bucket prefix after the rewrite. Only `return` is safe inside `if`.
		if ($request_uri ~* "(\.\.|%2e|\\\\|%5c)") {
			return 400;
		}

		# `set` is a rewrite-module directive, so it must come BEFORE the
		# `rewrite ... break` below: break stops the rewrite phase, and anything
		# after it never runs, leaving the variable empty.
		set $storage_upstream sabstore-seaweedfs:9000;

		# S3 path-style format: /bucket-name/object-path. The bucket name is
		# hardcoded and must match the MINIO_BUCKET_NAME default. The trailing `?`
		# drops the client query string so ?policy, ?acl, ?list-type=2, ?tagging
		# and ?uploads never reach S3 and turn an object GET into a sub-resource call.
		rewrite ^/uploads/(.+)$ /sabstore/$1? break;

		proxy_pass http://$storage_upstream;
		proxy_http_version 1.1;

		# Path-style addressing: Host is the storage endpoint, not the public
		# hostname, so the request is independent of the client's Host header.
		proxy_set_header Host $storage_upstream;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Browsers cannot authenticate to S3; a forwarded signature or copy source
		# must never influence the request, so requests stay anonymous.
		proxy_set_header Authorization "";
		proxy_set_header X-Amz-Copy-Source "";
		# Storage has no use for the site's session cookie.
		proxy_set_header Cookie "";

		# Object storage specific settings
		proxy_buffering off;
		proxy_request_buffering off;
		
		# Cache static assets
		expires 7d;
		add_header Cache-Control "public, immutable";
		# add_header in this location replaces (not merges with) the
		# server-level ones, so the security headers must be re-included.
		include /etc/nginx/security-headers.conf;

		# Handle errors gracefully
		proxy_intercept_errors on;
		error_page 404 =404 /404.html;
	}

	# No cache for index.html - always serve fresh
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Vite assets folder - long-term cache with hash names
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		include /etc/nginx/security-headers.conf;
		# Explicitly return 404 for missing files - do NOT fallback to index.html
		try_files $uri =404;
	}

	# Static files - return 404 if not found
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Cache manifest and logos
	location ~* ^/(manifest\.json|favicon\.ico|favicon\.png|robots\.txt)$ {
		expires 7d;
		add_header Cache-Control "public";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Default - serve and fallback to index.html for SPA
	# This catches HTML routes only (after static assets are matched above)
	location / {
		index index.html;
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
		include /etc/nginx/security-headers.conf;
	}
}
