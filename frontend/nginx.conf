# Forward the received chain verbatim. real_ip_recursive below already folds the
# client out of this very header into $remote_addr, so appending $remote_addr
# (proxy_add_x_forwarded_for) would list the visitor twice. Traefik overwrites
# a client-supplied X-Forwarded-For (measured), so the first entry is the real
# visitor and cannot be forged from outside.
map $http_x_forwarded_for $sab_forwarded_for {
	""      $remote_addr;
	default $http_x_forwarded_for;
}

# Share-preview caches. The cache lives on the container's own disk: Coolify
# recreates every container on each deploy and the compose file may not add a
# named volume, so both caches are empty after a deploy and the first request
# per product/combo re-renders (a burst of sharp work on the backend right
# after deploy). Neither cache holds anything that cannot be rebuilt.
proxy_cache_path /var/cache/nginx/share_meta levels=1:2 keys_zone=share_meta:1m max_size=10m inactive=10m;
proxy_cache_path /var/cache/nginx/share_image levels=1:2 keys_zone=share_image:5m max_size=200m inactive=7d;

# Image renders are the expensive call; the key is the visitor address that
# set_real_ip_from below restores, not Traefik's.
limit_req_zone $binary_remote_addr zone=og:1m rate=5r/s;
# Share pages cost one backend lookup each (the SSI meta subrequest).
limit_req_zone $binary_remote_addr zone=share_page:1m rate=10r/s;

server {
	listen 80;
	server_name localhost;
	root /usr/share/nginx/html;

	# $remote_addr (and so the access log) is Traefik for every request unless
	# restored. The range is the Coolify project network: Coolify assigns it and
	# the compose file may not pin it, so it is a /16 rather than one /24. The
	# frontend is reachable only from that network, so only Traefik and sibling
	# containers can present an X-Forwarded-For to be trusted.
	set_real_ip_from 10.0.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	# Ensure correct MIME types are loaded
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Performance optimization
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	# No global override: default (1M) applies to every route except
	# /api/upload, which sets its own limit below. Shrinks upload surface.

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css text/xml text/javascript
	           application/json application/javascript application/xml+rss
	           application/rss+xml font/truetype font/opentype
	           application/vnd.ms-fontobject image/svg+xml;
	gzip_disable "msie6";

	# Security headers
	include /etc/nginx/security-headers.conf;

	# DNS resolver - use Docker internal DNS for service discovery
	resolver 127.0.0.11 valid=10s ipv6=off;
	resolver_timeout 5s;

	# Health check endpoint
	location /health {
		access_log off;
		return 200 "healthy\n";
		add_header Content-Type text/plain;
	}

	# API requests - proxy to backend
	location /api/ {
		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		# Proxy headers
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;

		# Buffering
		proxy_buffering on;
		proxy_buffer_size 4k;
		proxy_buffers 8 4k;
		proxy_busy_buffers_size 8k;

		# Disable cache for API
		proxy_no_cache 1;
		proxy_cache_bypass 1;
	}

	# The share endpoints are reachable only through /_share_meta and /og/ below,
	# which cap and cache them. Left to /api/ they would be uncached and let
	# anyone drive the image renderer directly.
	# Case-insensitive on purpose: Express routes case-insensitively, so a
	# case-sensitive block would let /api/SHARE/... through to the renderer.
	location ~* ^/api/share(/|$) {
		return 404;
	}

	# Upload endpoint - special handling for large files
	location /api/upload {
		client_max_body_size 50M;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Extended timeouts for uploads
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		# Request buffering off for large uploads
		proxy_request_buffering off;
	}

	# Database import accepts a JSON dump of the whole store. Without an explicit
	# limit it falls under `location /api/` and inherits nginx's 1M default, so a
	# full export is rejected with 413 before it ever reaches the backend — which
	# accepts up to 10M via multer (routes/admin/database.js). The longer prefix
	# makes this win over /api/. Keep this at or above multer's limit so an
	# oversized file gets the backend's explicit 400 instead of a bare nginx 413.
	location /api/admin/database/import {
		client_max_body_size 10M;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		# Importing hundreds of orders takes far longer than a normal API call.
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;

		proxy_request_buffering off;
	}

	# The bare prefix would map to the bucket root and let anyone list it.
	location = /uploads/ {
		return 404;
	}

	# Static product images directly from object storage (SeaweedFS S3), must be
	# BEFORE the regex static files location. The bucket is anonymous-read, so this
	# proxy must expose object GETs only, never S3 sub-resources or writes.
	location ^~ /uploads/ {
		# GET implies HEAD. Everything else (PUT/DELETE/POST) is refused here
		# regardless of what the bucket policy would allow.
		limit_except GET {
			deny all;
		}

		# Encoded or literal dot-segments and backslashes could climb out of the
		# bucket prefix after the rewrite. Only `return` is safe inside `if`.
		if ($request_uri ~* "(\.\.|%2e|\\\\|%5c)") {
			return 400;
		}

		# `set` is a rewrite-module directive, so it must come BEFORE the
		# `rewrite ... break` below: break stops the rewrite phase, and anything
		# after it never runs, leaving the variable empty.
		set $storage_upstream sabstore-seaweedfs:9000;

		# S3 path-style format: /bucket-name/object-path. The bucket name is
		# hardcoded and must match the MINIO_BUCKET_NAME default. The trailing `?`
		# drops the client query string so ?policy, ?acl, ?list-type=2, ?tagging
		# and ?uploads never reach S3 and turn an object GET into a sub-resource call.
		rewrite ^/uploads/(.+)$ /sabstore/$1? break;

		proxy_pass http://$storage_upstream;
		proxy_http_version 1.1;

		# Path-style addressing: Host is the storage endpoint, not the public
		# hostname, so the request is independent of the client's Host header.
		proxy_set_header Host $storage_upstream;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Browsers cannot authenticate to S3; a forwarded signature or copy source
		# must never influence the request, so requests stay anonymous.
		proxy_set_header Authorization "";
		proxy_set_header X-Amz-Copy-Source "";
		# Storage has no use for the site's session cookie.
		proxy_set_header Cookie "";

		# Object storage specific settings
		proxy_buffering off;
		proxy_request_buffering off;
		
		# Cache static assets
		expires 7d;
		add_header Cache-Control "public, immutable";
		# add_header in this location replaces (not merges with) the
		# server-level ones, so the security headers must be re-included.
		include /etc/nginx/security-headers.conf;

		# Handle errors gracefully
		proxy_intercept_errors on;
		error_page 404 =404 /404.html;
	}

	# No cache for index.html - always serve fresh
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Per-product/combo <head> tags, spliced into index.html by SSI (see the
	# og_default block in index.html). Everything that goes wrong here must end in
	# an empty body so the SSI `stub` (the generic tags) applies: a JSON error body
	# would otherwise land inside <head>. People and crawlers get the same bytes;
	# there is deliberately no User-Agent branching.
	location = /_share_meta {
		internal;
		ssi off;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream/api/share/meta$is_args$args;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		# The fragment is parsed by nginx's SSI filter, which cannot read gzip.
		proxy_set_header Accept-Encoding "";

		# A slow or dead backend must not hold the page: fall back to generic tags.
		proxy_connect_timeout 1s;
		proxy_read_timeout 2s;

		proxy_intercept_errors on;
		error_page 400 404 429 500 502 503 504 =204 @share_empty;

		# The key is the canonical query only, so tracking parameters on the page
		# URL (fbclid, zarsrc) cannot multiply backend lookups.
		proxy_cache share_meta;
		proxy_cache_key "share_meta|$args";
		proxy_cache_lock on;
		proxy_cache_valid 200 60s;
		proxy_cache_valid 404 30s;
		proxy_cache_use_stale error timeout updating;
		# Backend cache headers must not override the TTLs above.
		proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
	}

	location @share_empty {
		internal;
		return 204;
	}

	# Share page: same index.html for everyone, <head> tags replaced via SSI.
	# Code alphabet = PUBLIC_CODE_ALPHABET in backend/utils/public-code.js, upper
	# case only: one code must map to one cache key, or case variants of a single
	# code multiply backend lookups and renders. Lower-case links still open the
	# SPA page, just without the product's preview tags. Must stay ABOVE the static-file
	# regex below, which would otherwise take a slug ending in ".jpg".
	location ~ "^/(?<share_type>[pc])/(?<share_code>[2-9A-HJKMNP-Z]{8})(/[^/]{0,120})?$" {
		limit_req zone=share_page burst=20 nodelay;
		limit_req_status 429;
		ssi on;
		ssi_silent_errors on;
		# SSI output has no stable validator; a conditional 304 would pin a stale <head>.
		etag off;

		add_header Cache-Control "no-cache";
		include /etc/nginx/security-headers.conf;

		rewrite ^ /index.html break;
	}

	# Social preview image. Also ABOVE the static-file regex (it ends in .jpg).
	location ~ "^/og/(?<og_type>[pc])/(?<og_code>[2-9A-HJKMNP-Z]{8})\.jpg$" {
		limit_except GET {
			deny all;
		}

		# ogVersion is 8 hex chars. Anything else is junk that would only bloat
		# the cache with 404 entries, so it never reaches the backend.
		if ($arg_v !~ "^[0-9a-f]{8}$") {
			return 404;
		}

		limit_req zone=og burst=10 nodelay;
		limit_req_status 429;

		set $backend_upstream sabstore-backend:5000;
		proxy_pass http://$backend_upstream/api/share/image/$og_type/$og_code.jpg?v=$arg_v;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $sab_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		proxy_read_timeout 10s;

		# One render per image even when many crawlers arrive together.
		proxy_cache share_image;
		proxy_cache_key "og:$og_type:$og_code:$arg_v";
		proxy_cache_lock on;
		proxy_cache_lock_timeout 10s;
		proxy_cache_valid 200 1d;
		proxy_cache_valid 404 503 60s;
		proxy_cache_use_stale error timeout updating;
		proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
	}

	# Vite assets folder - long-term cache with hash names
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		include /etc/nginx/security-headers.conf;
		# Explicitly return 404 for missing files - do NOT fallback to index.html
		try_files $uri =404;
	}

	# Self-hosted Monaco bundle (scripts/copy-monaco.mjs). Revalidated, never
	# immutable: loader.js and editor.main.js keep their names across Monaco
	# versions while the chunks they reference are renamed, so a year-long cached
	# entry file would request chunks that no longer exist after an upgrade.
	# `^~` keeps the regex block below from matching these .js/.css files first.
	location ^~ /monaco/ {
		add_header Cache-Control "no-cache";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Static files - return 404 if not found
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Cache manifest and logos
	location ~* ^/(manifest\.json|favicon\.ico|favicon\.png|robots\.txt)$ {
		expires 7d;
		add_header Cache-Control "public";
		include /etc/nginx/security-headers.conf;
		try_files $uri =404;
	}

	# Default - serve and fallback to index.html for SPA
	# This catches HTML routes only (after static assets are matched above)
	location / {
		index index.html;
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
		include /etc/nginx/security-headers.conf;
	}
}
