# Shared security headers, included by the server block and by every
# location that declares its own `add_header` (nginx only inherits
# add_header from the parent level when the location has none of its own,
# so each such location must `include` this file again).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy, REPORT-ONLY on purpose.
#
# helmet in the backend only sets CSP on API responses, so the HTML users
# actually load had no policy at all — tightening scriptSrc there bought
# nothing for the browser. This is the layer that matters.
#
# It ships report-only because an enforcing policy that is even slightly wrong
# takes the storefront down, and this has not been verified in a browser yet.
# Violations appear in the devtools console and change nothing else.
#
# To enforce: load the site, exercise admin + checkout + direct sales, confirm
# the console reports no violation, then rename the header to
# `Content-Security-Policy`.
#
# Origins below are the ones the app actually references: Google Fonts (CSS +
# font files) and cdnjs (Font Awesome). `data:` and `blob:` are kept for images
# because the product form previews uploads from a canvas before sending them.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
