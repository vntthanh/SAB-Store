# Shared security headers, included by the server block and by every
# location that declares its own `add_header` (nginx only inherits
# add_header from the parent level when the location has none of its own,
# so each such location must `include` this file again).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
