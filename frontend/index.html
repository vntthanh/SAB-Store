<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.png" type="image/png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#4C4CA6" />
	<meta name="description" content="Cửa hàng vật phẩm do SAB sản xuất dành cho sinh viên fit@hcmus. Đặt hàng online, nhận tại trường." />
	<link rel="apple-touch-icon" href="/logo192.png" />

	<!-- Open Graph / Zalo / Messenger link preview.
	     Hardcoded absolute URLs on purpose: Facebook and Zalo both reject
	     relative paths, and a crawler never runs the JS that a runtime value
	     would depend on. This is the documented exception to AD-3, which
	     removed build-time domain variables for the API path only.
	     Image is 2242x934 (~2.4:1, 65 KB) — wider than the 1.91:1 ideal, so
	     crawlers centre-crop it; that is why the card is summary_large_image
	     and not the square summary. -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="SAB Store" />
	<meta property="og:url" content="https://store.sabies.vn/" />
	<meta property="og:title" content="SAB Store — Vật phẩm SAB dành cho sinh viên fit@hcmus" />
	<meta property="og:description" content="Cửa hàng vật phẩm do SAB sản xuất dành cho sinh viên fit@hcmus. Đặt hàng online, nhận tại trường." />
	<meta property="og:image" content="https://store.sabies.vn/logo512.png" />
	<meta property="og:image:width" content="2242" />
	<meta property="og:image:height" content="934" />
	<meta property="og:image:alt" content="SAB Store" />
	<meta property="og:locale" content="vi_VN" />

	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="SAB Store — Vật phẩm SAB dành cho sinh viên fit@hcmus" />
	<meta name="twitter:description" content="Cửa hàng vật phẩm do SAB sản xuất dành cho sinh viên fit@hcmus. Đặt hàng online, nhận tại trường." />
	<meta name="twitter:image" content="https://store.sabies.vn/logo512.png" />

	<link rel="manifest" href="/manifest.json" />

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
		rel="stylesheet">

	<!-- Font Awesome for icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<title>SAB Store</title>
</head>

<body>
	<noscript>Bạn cần bật JavaScript để chạy ứng dụng này.</noscript>
	<div id="root"></div>
	<div id="modal-root"></div>

	<!-- Vite entry point -->
	<script type="module" src="/src/index.js"></script>
</body>

</html>
