# Coolify-native variant of prod.compose.yml.
#
#   * The `backend` service is renamed `sabstore-backend`. Coolify registers the
#     compose SERVICE name as the network alias, and frontend/nginx.conf proxies to
#     `sabstore-backend:5000`. Renaming the service preserves that name without
#     editing app config or rebuilding the frontend image. The old explicit alias
#     existed because `multi-domain` was shared and another stack already owned the
#     plain name `backend`; with one network per resource that clash cannot happen.
#   * No `networks:` blocks, no `container_name:` — Coolify owns both.
#   * Named volumes replaced by absolute binds under /srv/appdata/vol/. Coolify
#     rewrites compose-declared volume names, which would have detached MongoDB,
#     SeaweedFS and the upload store from their data.
# Both images build with `context: .` (the repository root, Coolify Base Directory `/`)
# and `dockerfile: backend/Dockerfile` / `frontend/Dockerfile`: the pnpm workspace
# lockfile lives at the root, and the root .dockerignore plus each image's
# <Dockerfile>.dockerignore decide what enters the build. Rollback of that move:
# redeploy the previous `main` commit in Coolify.
# Backend and frontend are built from source on every deploy (Coolify runs
# `compose build` before stopping anything; `pull_policy: never` then keeps `up` from
# building or pulling a second time). Until 2026-09-29 they ran pre-built images from the
# host registry because the first source build (2026-09-21) failed with
# `vite: not found`; that failure could not be reproduced afterwards, locally or with
# the platform's build args. Rollback (both services together, never one): git-revert
# this change, i.e. restore `image: 127.0.0.1:5000/sab-store-{backend,frontend}:migrated-260921`
# with `pull_policy: always` (instead of `never`) AND delete the `build:` blocks - keeping `build:` next to
# `image:` would rebuild from source under the old tag instead of rolling back. Those
# two tags stay in the host registry for that purpose.
# Object storage is SeaweedFS (`sabstore-seaweedfs`), configured by an inline script in
# its `command:`. It refuses to start on an empty, default (`minioadmin`) or short key,
# because a missing identity file would leave S3 open to anonymous writes. Its gRPC
# ports are reachable inside the project network; the filer signing key generated at
# start makes the IAM gRPC reject unsigned callers. Rollback of storage: restore the
# `minio` service and its /srv/appdata/vol/sab-store_minio_data bind from git, and
# point MINIO_ENDPOINT back at it; that bind is left untouched by SeaweedFS.
# MongoDB runs as a single-node replica set (`rs0`) because transactions need one; the
# healthcheck initiates it on first start. The keyfile is written from MONGO_REPLICA_KEY
# into /etc/mongo, never /tmp (fs.protected_regular crash-loops a restarted container).
# MONGODB_URI must carry `replicaSet=rs0`. Rollback (together with reverting the backend's
# replica-set startup check, or it refuses to boot): drop --replSet/--keyFile and the
# `replicaSet` URI option; mongod then starts standalone on the same data dir.
# Deploy downtime: Coolify removes EVERY container of the project before `compose up`
# (even services whose config did not change), so the site is down from the first stop
# until the new frontend is healthy. Measured on one deploy: ~100 s = 30 s nginx stop +
# 21 s mongod stop + 27 s second image build + 16 s SeaweedFS start + 5 s first health
# probe. The settings below target each of those; they must not be undone:
#   * `pull_policy: never` on the built services (not `build`: that rebuilds at `up`);
#   * `stop_signal: SIGTERM` on nginx, `shutdownTimeoutMillisForSignaledShutdown` on mongod;
#   * `start_interval` on every healthcheck, `service_started` for the backend's deps.
# The `${VAR:?message}` form is NOT used in this file. The deployment platform does
# not implement error-if-unset: it substitutes the MESSAGE as the value, so
# `${PUBLIC_URL:?PUBLIC_URL is required}` silently becomes the literal string
# `PUBLIC_URL is required` - observed here on 2026-09-21, with a backend that
# crash-looped on an invalid base URL and databases that would have been handed a
# password of `POSTGRES_PASSWORD must be set`. Plain `${VAR}` is used instead; the
# values come from the platform environment store.
services:
  # SAB Store MongoDB Database
  mongodb:
    image: mongo:6.0.28@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
    cpus: 2
    restart: unless-stopped
    # Default WiredTiger cache is 50% x (RAM - 1GB) ~= 4.3GB on this box,
    # which is shared with ~40 containers from other projects; capped to 0.25 below.
    # Replica set (not standalone) so multi-document transactions work. The keyfile
    # is generated from the runtime env at every start, so nothing has to exist on
    # the host beforehand. It lives in /etc/mongo, not /tmp: the host sets
    # fs.protected_regular=2, which forbids even root from re-creating a file owned
    # by another user in a sticky directory, and a restarted (not recreated)
    # container still holds last run's mongodb-owned file - hence the `rm -f`.
    # Every `$` is doubled: compose would otherwise interpolate it first.
    # shutdownTimeoutMillisForSignaledShutdown: a replica-set member otherwise sits in a
    # 15 s "quiesce" period after SIGTERM (measured ~21 s per stop), and the site is down
    # for all of it during a deploy. The backend is already stopped by then and mongod
    # still checkpoints and closes cleanly; only the wait for clients to drain is cut.
    #
    # Fail-closed on purpose: the platform turns an unset variable into an empty
    # string, and a mongod with no usable keyfile must never start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        key="$${MONGO_REPLICA_KEY:-}"
        case "$$key" in
          '' | *[!A-Za-z0-9+/=]*) fail "MONGO_REPLICA_KEY must be non-empty base64 characters only (no newlines)" ;;
        esac
        [ "$${#key}" -ge 6 ] && [ "$${#key}" -le 1024 ] || fail "MONGO_REPLICA_KEY must be 6-1024 characters"
        umask 077
        mkdir -p /etc/mongo
        # umask 077 would leave the directory 0700 root: mongod (uid 999) could not reach its keyfile.
        chmod 755 /etc/mongo
        rm -f /etc/mongo/keyfile
        printf '%s' "$$key" > /etc/mongo/keyfile
        # mongod runs as uid 999 after the image entrypoint drops privileges; it
        # rejects a keyfile that is group/world accessible or not readable by it.
        chown 999:999 /etc/mongo/keyfile
        chmod 400 /etc/mongo/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo/keyfile --bind_ip_all --wiredTigerCacheSizeGB 0.25 --setParameter shutdownTimeoutMillisForSignaledShutdown=1000
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-minipreorder}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "27017"
    volumes:
      - /srv/appdata/vol/sab-store_mongodb_data:/data/db
    # Idempotent bootstrap: the first probe that finds the set uninitialised
    # (fresh or just-converted data dir) initiates it; afterwards it only reports
    # whether this node is primary. Credentials come from the container env via
    # process.env, so they never appear in argv or output.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --quiet --eval '
            const admin = db.getSiblingDB("admin");
            if (!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
            try {
              admin.runCommand({ replSetGetStatus: 1 });
            } catch (e) {
              if (e.code !== 94 && e.codeName !== "NotYetInitialized") quit(1);
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            }
            quit(admin.hello().isWritablePrimary ? 0 : 1);
          '
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      # Probe often only while starting (start_period): the first success, not the
      # steady-state interval, decides how soon dependants and the proxy see it healthy.
      start_interval: 2s

  # SAB Store object storage (SeaweedFS, S3 API on :9000)
  sabstore-seaweedfs:
    # Replaces MinIO, whose upstream repository is archived. Pinned by digest;
    # 4.47 contains the fixes for the published path-traversal CVEs.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    cpus: 2
    restart: unless-stopped
    # Written inline so the identity and signing key are generated from the
    # platform environment at every start. Every `$` is doubled: compose would
    # otherwise interpolate it before the shell sees it.
    #
    # Fail-closed on purpose: a missing identity file makes SeaweedFS accept
    # anonymous S3 writes, and the platform turns an unset variable into an empty
    # string instead of failing, so `set -u` alone would not catch it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        check_key() {
          [ -n "$$2" ] || fail "$$1 is empty"
          [ "$$2" != minioadmin ] || fail "$$1 must not be the default minioadmin"
          [ "$${#2}" -ge 16 ] || fail "$$1 must be at least 16 characters"
          case "$$2" in *'"'* | *'\'*) fail "$$1 must not contain a quote or backslash" ;; esac
        }
        check_key MINIO_ROOT_USER "$${S3_ACCESS_KEY:-}"
        check_key MINIO_ROOT_PASSWORD "$${S3_SECRET_KEY:-}"
        case "$${S3_BUCKET:-}" in
          '' | *[!a-z0-9-]*) fail "MINIO_BUCKET_NAME must be non-empty and use only a-z, 0-9 and -" ;;
        esac
        umask 077
        # Config lives in /etc/seaweedfs, not /tmp: the host sets
        # fs.protected_regular=2, which forbids even root from re-creating a file
        # owned by another user in a sticky directory. A container that was
        # restarted rather than recreated still holds last run's seaweed-owned
        # files, so they are removed before being written again.
        mkdir -p /etc/seaweedfs
        rm -f /etc/seaweedfs/s3.json /etc/seaweedfs/security.toml
        printf '{"identities":[{"name":"sabstore-backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin:%s","Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /etc/seaweedfs/s3.json
        # Without a filer signing key the internal gRPC IAM cache accepts
        # unauthenticated callers, who could mint themselves an admin identity.
        printf '[jwt.filer_signing]\nkey = "%s"\n' "$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /etc/seaweedfs/security.toml
        # The image entrypoint drops to the `seaweed` user. Root-owned 0600 files
        # are then unreadable and SeaweedFS silently starts with no identities and
        # no signing key, i.e. wide open.
        chown seaweed:seaweed /etc/seaweedfs/s3.json /etc/seaweedfs/security.toml
        exec /entrypoint.sh server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.ip.bind=0.0.0.0 -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/etc/seaweedfs/s3.json
    mem_limit: 768m
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET_NAME:-sabstore}
      # Go's heap is otherwise uncapped (~600 MiB observed) and would hit mem_limit.
      GOMEMLIMIT: 384MiB
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host. Master/volume/filer listen on loopback inside
    # the container; only the S3 port is reachable, from sabstore_network (backend
    # SDK and the frontend nginx /uploads/ proxy).
    expose:
      - "9000"
    volumes:
      - /srv/appdata/vol/sab-store_seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      # Probe often only while starting (start_period): the first success, not the
      # steady-state interval, decides how soon dependants and the proxy see it healthy.
      start_interval: 2s

  # SAB Store Redis: dispatcher for the stock-movement queue (BullMQ). It is NOT the
  # source of truth - every stock movement is a pending document in MongoDB first, and
  # a sweeper re-enqueues anything Redis lost - so losing this data only delays stock
  # updates. `noeviction` is deliberate: Redis must refuse writes when full rather than
  # silently drop queued jobs.
  # Redis 8 rewrites its AOF/RDB in a format 7.x cannot load, so an image rollback to 7.x
  # must start on an EMPTY data dir (move the bind aside); the sweeper refills the queue.
  sabstore-redis:
    image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
    cpus: 0.5
    restart: unless-stopped
    # Fail-closed on purpose: the platform turns an unset variable into an empty
    # string, and a Redis with no password must never start. The password is
    # embedded in REDIS_URL, so it has to be URL-safe. Every `$` is doubled:
    # compose would otherwise interpolate it first.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        fail() { echo "$$1" >&2; exit 1; }
        pw="$${REDIS_PASSWORD:-}"
        case "$$pw" in
          '' | *[!A-Za-z0-9._~-]*) fail "REDIS_PASSWORD must be non-empty and use only A-Z a-z 0-9 . _ ~ -" ;;
        esac
        [ "$${#pw}" -ge 16 ] || fail "REDIS_PASSWORD must be at least 16 characters"
        exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 64mb --maxmemory-policy noeviction --requirepass "$$pw"
    # Redis 8 idles at ~48 MiB (bundled modules; 7.4 was ~18), measured 2026-10-10:
    # 64 MB maxmemory on top of that left no headroom for the AOF-rewrite fork.
    mem_limit: 192m
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # redis-cli reads this, so the healthcheck authenticates without the password in argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Never published to the host; reachable only from the project network.
    expose:
      - "6379"
    volumes:
      - /srv/appdata/vol/sab-store_redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      # Probe often only while starting (start_period): the first success, not the
      # steady-state interval, decides how soon dependants and the proxy see it healthy.
      start_interval: 1s

  # SAB Store Backend API
  sabstore-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpus: 2
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Shared Alloy on the host collects logs only from containers carrying these labels.
    labels:
      logging: david-alloy
      logging.project: sab-store
      logging.service: backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Only for the very first deploy on an empty database; the backend refuses
      # to initialise an empty production DB otherwise (catches a wrong DB name).
      INIT_EMPTY_DATABASE: ${INIT_EMPTY_DATABASE:-}
      PORT: ${BACKEND_PORT:-5000}
      # PUBLIC_URL is the single source for the public origin (AD-2):
      # BASE_URL and CORS_ORIGIN both derive from it instead of carrying
      # their own copies that can drift apart.
      PUBLIC_URL: ${PUBLIC_URL}
      BASE_URL: ${PUBLIC_URL}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APPSCRIPT_URL: ${APPSCRIPT_URL}
      CORS_ORIGIN: ${PUBLIC_URL}
      # The MINIO_* names are kept for the minio SDK; the server behind them is
      # SeaweedFS. The endpoint is fixed because the platform environment store
      # may still carry the old MinIO hostname, which would silently win.
      MINIO_ENDPOINT: sabstore-seaweedfs
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sabstore}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Dispatcher for stock movements; without it the backend still records them
      # and the sweeper applies them once Redis is back.
      REDIS_URL: redis://:${REDIS_PASSWORD}@sabstore-redis:6379
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "5000"
    # service_started, not service_healthy: start.js retries MongoDB (30 x 2 s) before
    # it listens and creates the storage bucket in the background after, and Redis is
    # optional. Waiting for health here only serialised the slowest dependency
    # (SeaweedFS) in front of the backend and frontend during the window the site is down.
    depends_on:
      mongodb:
        condition: service_started
        restart: true
      sabstore-seaweedfs:
        condition: service_started
        restart: true
      sabstore-redis:
        condition: service_started
        restart: true
    volumes:
      - /srv/appdata/vol/sab-store_backend_uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
      # Probe often only while starting (start_period): the first success, not the
      # steady-state interval, decides how soon dependants and the proxy see it healthy.
      start_interval: 2s
    # Only the frontend joins multi-domain. The backend is reachable
    # exclusively through the frontend nginx /api/ proxy.
    #
    # The alias must be project-unique: `multi-domain` is shared with other
    # stacks and another project already owns the plain name `backend` there,
    # so the frontend (which is on both networks) would resolve to it.

  # SAB Store Frontend React App (with Nginx Reverse Proxy)
  frontend:
    # No VITE_API_URL build arg/env: the SPA calls the API via the relative
    # path /api (AD-3), so nothing domain-specific is baked into the bundle.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    cpus: 2
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    # nginx's image stops on SIGQUIT (graceful): it waits for open keep-alive
    # connections from the proxy until the platform's 30 s stop timeout kills it.
    # SIGTERM is nginx's fast shutdown; nothing here needs connections to drain.
    stop_signal: SIGTERM
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Shared Alloy on the host collects logs only from containers carrying these labels.
    labels:
      logging: david-alloy
      logging.project: sab-store
      logging.service: frontend
    expose:
      - 80
    depends_on:
      sabstore-backend:
        condition: service_started
        restart: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      # Probe often only while starting (start_period): the first success, not the
      # steady-state interval, decides how soon dependants and the proxy see it healthy.
      start_interval: 1s
